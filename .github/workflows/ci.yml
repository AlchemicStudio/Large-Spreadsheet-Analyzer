name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    env:
      # Overrides the .python-version pin for EVERY uv command in the job;
      # a bare `uv run` would otherwise re-sync the venv back to the pinned
      # interpreter and the matrix would silently always test 3.12.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check && uv run ruff format --check
      - name: Test
        # GUI-marked tests need a display and are excluded by the default addopts.
        run: uv run pytest -q
